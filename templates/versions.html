<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpus | Məsələ</title>
    <link rel="stylesheet" href="/static/css/problem_view.css">
    <link rel="shortcut icon" href="/static/images/logo2.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}
    <div class="problem_container">
        <div class="problem_container_head">
            <div class="prb_txt">
                <h2 class="problem_name">Version {{ update.version }}</h2>
            </div>
            <p class="id_of_problem" style="color: gray; font-weight: 150; font-size: 14px;">{{ update.date }}</p>
        </div>
        <hr>
        <div class="problem_context_container">
            <p class="problem_context_pharagraph">{{ update.content }}</p>
        </div>
    </div>
    <script src="/static/js/problem_view.js"></script>
</body>
</html>
